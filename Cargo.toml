[workspace]
resolver = "2"
members = [
    "core",
    "ragedroid/jni",
    "ragemanifest",
    "rageterm",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/eordano/ragewarden"
authors = ["Ragewarden contributors"]

[workspace.dependencies]
ragewarden-core = { path = "core" }

age = { version = "0.12", default-features = false, features = ["armor"] }

age-core = "0.12"

hkdf = "0.13"
hex = "0.4"
sha1 = "0.11"
sha2 = "0.11"
pbkdf2 = "0.13"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
hmac = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
subtle = "2.6"

chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "pkcs8", "std"] }

bip39 = "3"

zeroize = { version = "1.8", features = ["zeroize_derive"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
rand = "0.10"
rand_core = "0.10"
thiserror = "2"

async-trait = "0.1"

rsa = { version = "0.9", features = ["sha2"] }

serde_urlencoded = "0.7"

uuid = { version = "1", features = ["v4", "serde"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

clap = { version = "4", features = ["derive"] }

pcsc = "2"

ctap-hid-fido2 = "3"

keyring = "4"

fs2 = "0.4"

[profile.release]
codegen-units = 16
lto = "fat"
opt-level = 3
strip = "symbols"
panic = "abort"

[profile.android]
inherits = "release"
panic = "unwind"
