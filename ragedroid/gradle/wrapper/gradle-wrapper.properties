# This file is the single source of truth for the Gradle version, in both
# directions: .github/workflows/release.yml (the ragedroid job and the
# repro-build job) seds the version out of the distributionUrl below and runs
# `gradle wrapper --gradle-version "$version"` before ./gradlew, and
# scripts/repro/verify-ragedroid.sh compares it against the `gradle` it is about
# to use. Never write a Gradle version anywhere else.
#
# 9.7.1, exactly the Gradle nixpkgs' gradle_9 ships in the #android devshell
# (devshells/android.nix), which is the gradle verify-ragedroid.sh falls back to
# because a fresh checkout has no wrapper (see .gitignore). Different Gradle
# versions can produce different APK bytes, so if these two disagree a hash
# produced locally is not comparable with one produced by CI's wrapper -- and
# the documented cure for that red gate would be `--update-expected`, the one
# reflex scripts/repro/EXPECTED_HASHES.txt forbids. Move both in one commit: a
# nixpkgs bump that changes gradle_9 changes this line too.
#
# Floor: ragedroid/gradle/libs.versions.toml pins agp = 9.4.1, and AGP 9.4 refuses
# any Gradle below 9.6 before it configures a single module. Do not go below that.
#
# distributionSha256Sum is the zip's SHA-256 as services.gradle.org publishes it
# (gradle-<version>-bin.zip.sha256); nixpkgs' gradle_9 fetches the same zip under
# the same hash. The CI and release workflows pass it to `gradle wrapper`, so the
# generated ./gradlew refuses a distribution with any other bytes. It moves with
# the version, in the same commit.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
