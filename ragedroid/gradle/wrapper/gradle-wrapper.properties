# This file is the single source of truth for the Gradle version, in both
# directions: .github/workflows/release.yml (the ragedroid job and the
# repro-build job) seds the version out of the distributionUrl below and runs
# `gradle wrapper --gradle-version "$version"` before ./gradlew, and
# scripts/repro/verify-ragedroid.sh compares it against the `gradle` it is about
# to use. Never write a Gradle version anywhere else.
#
# 8.14.4, not the newer 8.14.5, and deliberately: 8.14.4 is what nixpkgs' gradle
# ships in the #android devshell (devshells/android.nix), which is the gradle
# verify-ragedroid.sh falls back to because a fresh checkout has no wrapper (see
# .gitignore). Different Gradle versions can produce different APK bytes, so
# while these two disagreed, a hash produced locally was not comparable with one
# produced by CI's wrapper -- and the documented cure for that red gate would
# have been `--update-expected`, the one reflex scripts/repro/EXPECTED_HASHES.txt
# forbids. Moving the wrapper down is the smaller half of the reconciliation: it
# is one line in a file this repo owns, whereas pinning nixpkgs' gradle up to
# 8.14.5 means an overlay in the devshell, which ragewarden does not own.
#
# Floor: ragedroid/gradle/libs.versions.toml pins agp = 8.13.2, and AGP's
# version check refuses anything below Gradle 8.13 ("Minimum supported Gradle
# version is 8.13") before it configures a single module. Do not go below that.
# Raising it means raising nixpkgs' gradle in the same commit, or the repro gate
# starts comparing two different builds again.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
