<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Ragewarden passkey</title>
<link rel="stylesheet" href="prf.css">
<script src="prf.js" defer></script>
</head>
<body>
<main>
  <h1>Ragewarden passkey</h1>
  <p id="ask">Waiting for the Ragewarden extension to send its request.</p>
  <button id="go" type="button" disabled>Use my passkey</button>
  <p id="status" role="status"></p>
  <p class="fine">This page asks your phone's passkey for one key and hands it to the
    Ragewarden extension in this browser. It sends nothing anywhere else.</p>
</main>
</body>
</html>
