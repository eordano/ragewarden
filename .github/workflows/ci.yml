name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  WASM_PACK_VERSION: "0.13.1"

jobs:
  cargo-workspace:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: core without the Bitwarden layers
        run: cargo test -p ragewarden-core --no-default-features --all-targets

      - name: cargo doc
        run: cargo doc --workspace --no-deps

  supply-chain:
    name: supply-chain (cargo-deny + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install cargo-deny and cargo-audit
        env:
          RUSTFLAGS: ""
        run: |
          cargo install --locked cargo-deny
          cargo install --locked cargo-audit

      - name: cargo deny (sources + bans)
        run: cargo deny check sources bans

      - name: cargo deny (advisories + licenses) -- report only
        continue-on-error: true
        run: cargo deny check advisories licenses

      - name: cargo audit -- report only
        continue-on-error: true
        run: cargo audit

  e2e-vaultwarden:
    name: e2e (real Vaultwarden in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install pcsc-lite
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: pre-pull vaultwarden
        run: docker pull docker.io/vaultwarden/server:1.37.3
      - name: run e2e harness
        env:
          RAGEWARDEN_E2E: "1"
          RUST_LOG: warn
        run: cargo test -p rageterm --test e2e_vaultwarden --test e2e_protocol -- --nocapture --test-threads=1

  ragemanifest-wasm:
    name: ragemanifest wasm-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: install wasm-pack (pinned)
        env:
          RUSTFLAGS: ""
        run: cargo install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: wasm-pack build
        run: wasm-pack build --target web ragemanifest

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ragemanifest/pnpm-lock.yaml

      - name: extension builds, smoke and unit tests
        working-directory: ragemanifest
        run: |
          pnpm install --frozen-lockfile
          for target in chromium firefox safari; do node build.mjs "$target"; done
          node tests/smoke-firefox.mjs --static-only
          pnpm run test:unit

      - uses: actions/upload-artifact@v4
        with:
          name: ragemanifest-wasm
          path: ragemanifest/pkg/

  e2e-playwright:
    name: e2e (Playwright + virtual WebAuthn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ragemanifest/tests/playwright/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: install wasm-pack (pinned)
        env:
          RUSTFLAGS: ""
        run: cargo install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: pre-pull vaultwarden
        run: docker pull docker.io/vaultwarden/server:1.37.3

      - name: install playwright deps
        working-directory: ragemanifest/tests/playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: run playwright harness
        working-directory: ragemanifest/tests/playwright
        env:
          CI: "1"
        run: pnpm exec playwright test

      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ragemanifest/tests/playwright/playwright-report/
          if-no-files-found: ignore

  safari:
    name: Safari app (xcodebuild, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: install wasm-pack (pinned)
        env:
          RUSTFLAGS: ""
        run: cargo install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build the Safari bundle
        run: |
          wasm-pack build --target web ragemanifest
          node ragemanifest/build.mjs safari

      - name: host app Swift package
        run: swift build --package-path ragemanifest/safari-host-app

      - name: Safari app via the web-extension converter
        run: bash ragemanifest/safari-host-app/build.sh

  ragedroid-android:
    name: ragedroid android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install ndk
        run: sdkmanager "ndk;26.3.11579264"

      - name: gradle wrapper
        working-directory: ragedroid
        run: |
          version="$(sed -n 's|.*/gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$version" ]; then
            echo "::error::no distributionUrl version in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          sum="$(sed -n 's|^distributionSha256Sum=||p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$sum" ]; then
            echo "::error::no distributionSha256Sum in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          echo "gradle wrapper version (from gradle-wrapper.properties): $version, sha256 $sum"
          gradle wrapper --gradle-version "$version" --gradle-distribution-sha256-sum "$sum"

      - name: assemble debug (both flavors)
        working-directory: ragedroid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: ./gradlew :app:assembleStandardDebug :app:assembleFdroidDebug

      - name: unit tests
        working-directory: ragedroid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: ./gradlew :app:testStandardDebugUnitTest :app:testFdroidDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: ragedroid-apks
          path: |
            ragedroid/app/build/outputs/apk/standard/debug/*.apk
            ragedroid/app/build/outputs/apk/fdroid/debug/*.apk

  e2e-android:
    name: e2e (ragedroid emulator on Pixel 6 API 34)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install ndk + system image
        run: |
          sdkmanager "ndk;26.3.11579264"
          sdkmanager "system-images;android-34;aosp;x86_64"

      - name: gradle wrapper
        working-directory: ragedroid
        run: |
          version="$(sed -n 's|.*/gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$version" ]; then
            echo "::error::no distributionUrl version in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          sum="$(sed -n 's|^distributionSha256Sum=||p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$sum" ]; then
            echo "::error::no distributionSha256Sum in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          echo "gradle wrapper version (from gradle-wrapper.properties): $version, sha256 $sum"
          gradle wrapper --gradle-version "$version" --gradle-distribution-sha256-sum "$sum"

      - name: pixel6Api34 standardDebug androidTest
        working-directory: ragedroid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: ./gradlew :app:pixel6Api34StandardDebugAndroidTest --no-daemon

      - name: upload androidTest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ragedroid-androidtest-report
          path: |
            ragedroid/app/build/reports/androidTests/
            ragedroid/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  journey-contract:
    name: journey stays runnable (no emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: journey wiring contract
        run: |
          set -euo pipefail

          run=tests/journey/run.sh
          kt=ragedroid/app/src/androidTest/kotlin/ragewarden/ragedroid/journey/JourneyTest.kt
          gradle_kts=ragedroid/app/build.gradle.kts

          for f in "$run" "$kt" "$gradle_kts"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing; the journey cannot be run at all"
              exit 1
            fi
          done

          # run.sh is `sh`-compatible on purpose but is documented to be run
          # with bash; a syntax error here is a run that dies before it starts.
          bash -n "$run"
          # Step 6 of the journey renders the report. A syntax error in it turns
          # a fully green journey red at the last line, after 20 minutes.
          node --check tests/journey/report.mjs

          pkg="$(sed -n '1s/^package  *//p' "$kt")"
          if [ -z "$pkg" ]; then
            echo "::error::no package declaration on line 1 of $kt"
            exit 1
          fi
          echo "journey package: $pkg"

          bad=0

          # The filter has to name the package the test actually lives in.
          # If it stops matching, a plain connectedAndroidTest starts running
          # JourneyTest without its arguments and goes red for a reason that has
          # nothing to do with the app -- the exact failure the filter exists to
          # prevent.
          if ! grep -qF "testInstrumentationRunnerArguments[\"notPackage\"] = \"$pkg\"" "$gradle_kts"; then
            echo "::error::$gradle_kts no longer filters out '$pkg'."
            bad=1
          fi

          if ! grep -qF "RunnerArguments.class=$pkg.JourneyTest" "$run"; then
            echo "::error::$run does not select $pkg.JourneyTest by class."
            bad=1
          fi

          # Which gradle property lifts the filter, read from the gate itself
          # rather than hardcoded here. If run.sh stopped passing it, the
          # journey's own run would be filtered out of the journey: gradle
          # executes nothing and exits 0, which is the worst of the failure
          # modes because it looks like a pass.
          gate="$(sed -n 's|.*gradleProperty("android\.testInstrumentationRunnerArguments\.\([A-Za-z0-9_]*\)").*|\1|p' "$gradle_kts")"
          if [ -z "$gate" ]; then
            echo "::error::$gradle_kts no longer gates the notPackage filter on a gradle property."
            bad=1
          elif ! grep -qF "RunnerArguments.$gate=" "$run"; then
            echo "::error::the notPackage filter lifts on '$gate' but $run never passes it."
            echo "::error::The journey would be filtered out of its own run."
            bad=1
          else
            echo "notPackage filter lifts on: $gate (passed by run.sh)"
          fi

          # Every argument JourneyTest hard-requires must be supplied. requireArg()
          # throws with a message pointing at run.sh, so a missing one is a run
          # that dies on the device after the whole fixture has been built.
          required="$(grep -o 'requireArg("[A-Za-z0-9_]*")' "$kt" | sed 's|.*("||; s|")||' | sort -u)"
          if [ -z "$required" ]; then
            echo "::error::$kt declares no requireArg(...) at all; this check has stopped checking"
            exit 1
          fi
          for name in $required; do
            if grep -qF "RunnerArguments.$name=" "$run"; then
              echo "  ok: $name"
            else
              echo "::error::JourneyTest hard-requires instrumentation argument '$name'"
              echo "::error::and $run does not pass it."
              bad=1
            fi
          done

          exit "$bad"

  rageterm-cross:
    name: rageterm ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: install pcsc-lite (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: install cross
        if: matrix.cross
        run: cargo install --locked cross

      - name: build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p rageterm --target ${{ matrix.target }}
          else
            cargo build --release -p rageterm --target ${{ matrix.target }}
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: rageterm-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/rageterm
            target/${{ matrix.target }}/release/rageterm.exe
          if-no-files-found: ignore
