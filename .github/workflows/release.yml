name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WASM_PACK_VERSION: "0.13.1"

jobs:

  version:
    name: derive version from tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.derive.outputs.name }}
      code: ${{ steps.derive.outputs.code }}
    steps:
      - name: derive
        id: derive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH. This workflow triggers on 'v*', but"
            echo "::error::the Android versionCode is derived from the three numbers, so a tag it"
            echo "::error::cannot parse (or a pre-release suffix, which would collide with the"
            echo "::error::release it precedes) has no safe code. Retag as e.g. v1.4.2."
            exit 1
          fi
          # 10# forces base 10: a zero-padded field like 08 is an invalid octal
          # literal and would abort the arithmetic below.
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "::error::minor/patch must each be <= 999 in '$TAG'; above that the fields carry"
            echo "::error::into each other and versionCode stops tracking the tag's ordering."
            exit 1
          fi
          if (( major > 2099 )); then
            echo "::error::major must be <= 2099 in '$TAG'; Play's versionCode ceiling is 2100000000."
            exit 1
          fi
          code=$(( major * 1000000 + minor * 1000 + patch ))
          name="${TAG#v}"
          echo "versionName=$name versionCode=$code"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  tests:
    name: test suites
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  create-draft:
    name: create draft release
    runs-on: ubuntu-latest
    needs: [version, tests]
    steps:
      - name: create or reuse the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != "true" ]; then
              echo "::error::a PUBLISHED release already exists for $TAG. Re-running would append"
              echo "::error::assets to something users can already see, which is the failure mode"
              echo "::error::this draft flow exists to prevent. Delete that release (or cut a new"
              echo "::error::tag) and run again."
              exit 1
            fi
            echo "reusing the existing draft for $TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --generate-notes

  rageterm:
    name: rageterm ${{ matrix.target }}
    needs: [tests, create-draft]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install pcsc-lite (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: install cross
        if: matrix.cross
        run: cargo install --locked cross
      - name: build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p rageterm --target ${{ matrix.target }}
          else
            cargo build --release -p rageterm --target ${{ matrix.target }}
          fi
        shell: bash
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          if [ -f rageterm.exe ]; then
            7z a "../../../dist/rageterm-${{ matrix.target }}.zip" rageterm.exe
          else
            tar -czf "../../../dist/rageterm-${{ matrix.target }}.tar.gz" rageterm
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-rageterm-${{ matrix.target }}
          path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*

  rageterm-macos-universal:
    name: rageterm macos universal
    needs: [rageterm, create-draft]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-rageterm-*-apple-darwin
          path: artifacts
      - name: lipo
        run: |
          # -C needs the directory to already exist; `mkdir -p universal` alone
          # left tar extracting into a path that was never created.
          mkdir -p universal/x86 universal/arm
          tar -xzf artifacts/release-rageterm-x86_64-apple-darwin/rageterm-x86_64-apple-darwin.tar.gz -C universal/x86
          tar -xzf artifacts/release-rageterm-aarch64-apple-darwin/rageterm-aarch64-apple-darwin.tar.gz -C universal/arm
          lipo -create -output universal/rageterm universal/x86/rageterm universal/arm/rageterm
          tar -czf rageterm-universal-apple-darwin.tar.gz -C universal rageterm
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: rageterm-universal-apple-darwin.tar.gz

  ragemanifest:
    name: ragemanifest extension zips
    needs: [version, tests, create-draft]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install wasm-pack (pinned)
        run: cargo install --locked wasm-pack --version "$WASM_PACK_VERSION"
      - name: wasm-pack build
        run: wasm-pack build --target web ragemanifest
      - name: build extension zips
        working-directory: ragemanifest
        env:
          RAGEWARDEN_EXT_VERSION: ${{ needs.version.outputs.name }}
        run: |
          for browser in chromium firefox safari; do
            node build.mjs "$browser" --zip
            # maybeZipDist() only warns if the `zip` binary fails, and an empty upload
            # glob would publish a release with no extension at all. Fail here instead.
            if [ ! -f "dist/ragemanifest-$browser.zip" ]; then
              echo "::error::build.mjs did not emit dist/ragemanifest-$browser.zip"
              exit 1
            fi
          done
      - name: Chrome Web Store package (built and checked, not uploaded)
        working-directory: ragemanifest
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: node tests/check-store-package.mjs dist/ragemanifest-chromium.zip "$VERSION" dist/ragemanifest-chromium-webstore-$VERSION.zip
      - name: assert AMO credentials are present
        run: |
          if [ -z "${{ secrets.FIREFOX_API_KEY }}" ] || [ -z "${{ secrets.FIREFOX_API_SECRET }}" ]; then
            echo "::error::FIREFOX_API_KEY / FIREFOX_API_SECRET are not set; a release tag cannot produce a signed Firefox extension. Add them as bookmarks does."
            exit 1
          fi
      - name: sign the Firefox extension (AMO)
        id: ff-sign
        uses: kewisch/action-web-ext@fe10addf5d5e5ba6b78ffde720dd488a27d10e8c
        with:
          cmd: sign
          source: ragemanifest/dist/ragemanifest-firefox.zip
          channel: unlisted
          apiKey: ${{ secrets.FIREFOX_API_KEY }}
          apiSecret: ${{ secrets.FIREFOX_API_SECRET }}
          metaDataFile: ragemanifest/amo-metadata.json
      - name: stage the signed .xpi next to the zips
        run: |
          test -n "${{ steps.ff-sign.outputs.target }}" || {
            echo "::error::web-ext sign produced no signed artifact"; exit 1; }
          cp "${{ steps.ff-sign.outputs.target }}" ragemanifest/dist/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ragemanifest/dist/*.zip
            ragemanifest/dist/*.xpi

  ragedroid:
    name: ragedroid signed APK
    needs: [tests, create-draft, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-ndk
        run: cargo install --locked cargo-ndk
      - uses: android-actions/setup-android@v3
      - name: install ndk
        run: sdkmanager "ndk;26.3.11579264"
      - name: gradle wrapper
        working-directory: ragedroid
        run: |
          version="$(sed -n 's|.*/gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$version" ]; then
            echo "::error::no distributionUrl version in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          sum="$(sed -n 's|^distributionSha256Sum=||p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$sum" ]; then
            echo "::error::no distributionSha256Sum in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          echo "gradle wrapper version (from gradle-wrapper.properties): $version, sha256 $sum"
          gradle wrapper --gradle-version "$version" --gradle-distribution-sha256-sum "$sum"
      - name: materialise release keystore
        env:
          RAGEDROID_KEYSTORE_BASE64: ${{ secrets.RAGEDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RAGEDROID_KEYSTORE_BASE64" ]; then
            echo "::error::RAGEDROID_KEYSTORE_BASE64 is not set; a release tag cannot produce a signed APK."
            exit 1
          fi
          printf '%s' "$RAGEDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ragedroid-release.jks"
      - name: assemble release
        working-directory: ragedroid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          RAGEDROID_KEYSTORE: ${{ runner.temp }}/ragedroid-release.jks
          RAGEDROID_KEYSTORE_PASSWORD: ${{ secrets.RAGEDROID_KEYSTORE_PASSWORD }}
          RAGEDROID_KEY_ALIAS: ${{ secrets.RAGEDROID_KEY_ALIAS }}
          RAGEDROID_KEY_PASSWORD: ${{ secrets.RAGEDROID_KEY_PASSWORD }}
          RAGEDROID_VERSION_CODE: ${{ needs.version.outputs.code }}
          RAGEDROID_VERSION_NAME: ${{ needs.version.outputs.name }}
        run: ./gradlew :app:assembleStandardRelease :app:assembleFdroidRelease
      - name: shred release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ragedroid-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ragedroid-release-apks
          path: ragedroid/app/build/outputs/apk/**/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ragedroid/app/build/outputs/apk/**/*.apk

  repro-build:
    name: reproducible-build verification
    runs-on: ubuntu-latest
    needs: [rageterm, ragemanifest, ragedroid, version]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: install b3sum
        run: cargo install --locked b3sum

      - name: install pcsc-lite
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: install wasm-pack (pinned)
        run: cargo install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: install cargo-ndk
        run: cargo install --locked cargo-ndk

      - uses: android-actions/setup-android@v3
      - name: install ndk
        run: sdkmanager "ndk;26.3.11579264"

      - name: gradle wrapper
        working-directory: ragedroid
        run: |
          version="$(sed -n 's|.*/gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$version" ]; then
            echo "::error::no distributionUrl version in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          sum="$(sed -n 's|^distributionSha256Sum=||p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$sum" ]; then
            echo "::error::no distributionSha256Sum in ragedroid/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi
          echo "gradle wrapper version (from gradle-wrapper.properties): $version, sha256 $sum"
          gradle wrapper --gradle-version "$version" --gradle-distribution-sha256-sum "$sum"

      - name: verify ragemanifest wasm
        run: bash scripts/repro/verify-ragemanifest-wasm.sh

      - name: verify ragedroid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          RAGEDROID_VERSION_CODE: ${{ needs.version.outputs.code }}
          RAGEDROID_VERSION_NAME: ${{ needs.version.outputs.name }}
        run: bash scripts/repro/verify-ragedroid.sh

      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-build-hashes
          path: scripts/repro/EXPECTED_HASHES.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: scripts/repro/EXPECTED_HASHES.txt

  repro-rageterm:
    name: reproducible rageterm ${{ matrix.target }}
    needs: [rageterm]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install pcsc-lite (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: install cross
        if: matrix.cross
        run: cargo install --locked cross
      - name: install b3sum
        run: cargo install --locked b3sum
      - name: verify rageterm ${{ matrix.target }}
        shell: bash
        run: |
          args=(--target="${{ matrix.target }}")
          if [ "${{ matrix.cross }}" = "true" ]; then
            args+=(--cross)
          fi
          bash scripts/repro/verify-rageterm.sh "${args[@]}"

  publish:
    name: publish the release
    runs-on: ubuntu-latest
    needs:
      - version
      - tests
      - create-draft
      - rageterm
      - rageterm-macos-universal
      - ragemanifest
      - ragedroid
      - repro-build
      - repro-rageterm
    steps:
      - name: assert the draft is complete, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length")"
          if [ "$releases" != "1" ]; then
            echo "::error::expected exactly one release for $TAG, found $releases. More than one"
            echo "::error::means the assets are split across duplicate drafts and no single one of"
            echo "::error::them is the release; zero means create-draft's draft was deleted mid-run."
            exit 1
          fi

          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "assets attached to the $TAG draft:"
          echo "$assets"

          missing=0
          for want in \
            rageterm-x86_64-unknown-linux-gnu.tar.gz \
            rageterm-aarch64-unknown-linux-gnu.tar.gz \
            rageterm-x86_64-apple-darwin.tar.gz \
            rageterm-aarch64-apple-darwin.tar.gz \
            rageterm-x86_64-pc-windows-msvc.zip \
            rageterm-universal-apple-darwin.tar.gz \
            ragemanifest-chromium.zip \
            ragemanifest-firefox.zip \
            EXPECTED_HASHES.txt
          do
            if ! grep -qxF "$want" <<<"$assets"; then
              echo "::error::the $TAG draft has no asset named $want"
              missing=1
            fi
          done

          # The APK filenames come from AGP (flavor + build type), so they are
          # matched by extension rather than spelled out: two release flavors,
          # standard and fdroid, are assembled and both are published.
          apks="$(grep -c '\.apk$' <<<"$assets" || true)"
          if [ "$apks" -lt 2 ]; then
            echo "::error::expected 2 APKs (standard + fdroid release) on the $TAG draft, found $apks"
            missing=1
          fi

          if [ "$missing" != 0 ]; then
            echo "::error::refusing to publish an incomplete release; the draft is left in place"
            echo "::error::so you can inspect it, and deleting it is enough to allow a re-run."
            exit 1
          fi

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $TAG"
