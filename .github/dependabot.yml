version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      crypto:
        patterns: ["age", "age-core", "chacha20poly1305", "x25519-dalek", "hkdf", "sha1", "sha2", "pbkdf2", "hmac", "aes", "cbc", "rsa"]
      tooling:
        patterns: ["clap", "thiserror", "serde", "serde_json", "tokio", "reqwest"]

  - package-ecosystem: gradle
    directory: /ragedroid
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
